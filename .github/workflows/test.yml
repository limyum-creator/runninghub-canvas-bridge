name: Cross-platform tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Gyan builds are linked from https://ffmpeg.org/download.html.
          $zip = "$env:RUNNER_TEMP/ffmpeg.zip"
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip' -OutFile $zip -MaximumRetryCount 3
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba') { throw 'ffmpeg checksum mismatch' }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/ffmpeg"
          $probe = (Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Filter ffprobe.exe -Recurse | Select-Object -First 1).FullName
          if (!$probe) { throw 'ffprobe.exe missing from verified archive' }
          "RH_FFPROBE=$probe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $probe -version
      - run: npm run check
      - name: Regression tests
        run: node --test --test-reporter=spec --test-timeout=60000 tests/*.test.mjs
        timeout-minutes: 3
      - run: npm run build
      - run: npm run release:package
      - run: npm pack --dry-run
      - name: Verify ZIP on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem dist/*.zip | Select-Object -First 1).FullName -DestinationPath "$env:RUNNER_TEMP/rh-extension-check"
          if (!(Test-Path "$env:RUNNER_TEMP/rh-extension-check/manifest.json")) { throw 'Missing manifest' }
